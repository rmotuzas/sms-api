<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS API — Prisijungimas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4f46e5 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 2.5rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .login-card .brand { text-align: center; margin-bottom: 2rem; }
    .login-card .brand .icon {
      width: 56px; height: 56px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff; margin-bottom: .75rem;
    }
    .login-card .brand h4 { font-weight: 800; color: #1e293b; margin: 0; }
    .login-card .brand p { color: #64748b; font-size: .875rem; margin: .25rem 0 0; }
    .form-label { font-weight: 600; font-size: .875rem; color: #374151; }
    .form-control {
      border-radius: 8px; border: 1.5px solid #e2e8f0; padding: .65rem .9rem;
      font-size: .9rem; transition: border-color .15s;
    }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .btn-login {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; border: none; border-radius: 8px; padding: .7rem;
      font-weight: 600; width: 100%; font-size: .95rem;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
    .alert { border-radius: 8px; font-size: .875rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="icon"><i class="bi bi-send-fill"></i></div>
    <h4>SMS API Admin</h4>
    <p>Įveskite slaptažodį norėdami tęsti</p>
  </div>

  {% if error %}
  <div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="mb-3">
      <label class="form-label">Slaptažodis</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" autofocus required>
    </div>
    <button type="submit" class="btn btn-login">
      <i class="bi bi-unlock me-2"></i>Prisijungti
    </button>
  </form>
</div>
</body>
</html>
